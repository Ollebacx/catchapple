<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CATCHAPPLE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background-color: #72c6f8; /* Light Mario Sky Blue */
      overflow-x: hidden; /* Prevent horizontal scrollbars */
      -webkit-user-select: none; /* Safari */
      -ms-user-select: none; /* IE 10 and IE 11 */
      user-select: none; /* Standard syntax */
    }
    #root { 
      width: 100%; /* Max width for the game container */ 
      display: flex; 
      justify-content: center; 
      -webkit-user-select: none; /* Safari */
      -ms-user-select: none; /* IE 10 and IE 11 */
      user-select: none; /* Standard syntax */
    }
    /* Allow selection on specific input types if needed outside game controls */
    input[type="text"], 
    input[type="email"], 
    input[type="password"], 
    input[type="search"], 
    input[type="url"], 
    input[type="tel"], 
    input[type="number"], 
    textarea {
      -webkit-user-select: text; /* Safari */
      -ms-user-select: text; /* IE 10 and IE 11 */
      user-select: text; /* Standard syntax */
    }
    /* Custom Mario-like font - A bit more playful */
    body, button, input, h1, h2, h3, h4, h5, h6, p {
      font-family: 'Nunito', sans-serif;
    }
    .mario-title {
      font-family: 'Fredoka One', cursive;
    }
    /* Basic styling for range input track and thumb */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px; /* Increased height for touch */
      background: #fcd34d; /* Mario Yellow for track */
      border-radius: 8px;
      border: 2px solid #ca8a04; /* Darker yellow border */
      outline: none;
      opacity: 0.9;
      transition: opacity .15s ease-in-out;
    }
    input[type="range"]:hover {
      opacity: 1;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 30px; /* Larger thumb */
      height: 30px; /* Larger thumb */
      background: #ef4444; /* Mario Red for thumb */
      border: 2px solid #b91c1c; /* Darker red border */
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 2px rgba(0,0,0,0.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 30px; /* Larger thumb */
      height: 30px; /* Larger thumb */
      background: #ef4444; /* Mario Red for thumb */
      border: 2px solid #b91c1c; /* Darker red border */
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 2px rgba(0,0,0,0.5);
    }
  </style>
